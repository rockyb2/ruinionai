services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ruinionai
      POSTGRES_USER: ruinionai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruinionai -d ruinionai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    

  backend:
    build:
      context: ./agent_résumé
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    
    environment: 
      MEETING_ENCRYPTION_ACTIVE_KEY_ID: ${MEETING_ENCRYPTION_ACTIVE_KEY_ID:?MEETING_ENCRYPTION_ACTIVE_KEY_ID is not set}
      MEETING_ENCRYPTION_KEY_V1: ${MEETING_ENCRYPTION_KEY_V1:?MEETING_ENCRYPTION_KEY_V1 is not set}
      DATABASE_URL: postgresql+psycopg://ruinionai:${POSTGRES_PASSWORD}@db:5432/ruinionai
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set in .env file}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_ID: ${OPENROUTER_MODEL_ID:-openrouter/nvidia/nemotron-3.5-lightning:free}
      SUMMARY_MODEL_IDS: ${SUMMARY_MODEL_IDS:-}
      NEX_AGI_MODEL_ID: ${NEX_AGI_MODEL_ID:-openrouter/nex-agi/nex-n2.5-mini:free}
      NEX_AGI_MODEL_ID2: ${NEX_AGI_MODEL_ID2:-openrouter/nex-agi/nex-n2.5-pro:free}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL_ID: ${MISTRAL_MODEL_ID:-mistral/mistral-small-2603}
      MISTRAL_MODEL_ID2: ${MISTRAL_MODEL_ID2:-}
      MISTRAL_MODEL_ID3: ${MISTRAL_MODEL_ID3:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-}
      MISTRAL_AUDIO_MODEL: ${MISTRAL_AUDIO_MODEL:-voxtral-mini-latest}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      REPORTS_DIR: /app/storage/reports
      AUDIO_DIR: /app/storage/audio
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-true}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    
    volumes:
      - ./storage:/app/storage

    

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./front
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  
volumes:
  postgres_data:
